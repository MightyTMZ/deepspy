packages:
  - 'packages/*'

# Keep the compatible, established Zod release instead of resolving a day-old patch.
overrides:
  zod: 4.4.3

onlyBuiltDependencies:
  - better-sqlite3
  - sharp
  - protobufjs
  - onnxruntime-node

allowBuilds:
  better-sqlite3: true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true

# frontend/deepspy is a teammate-owned, self-contained pnpm workspace and is
# deliberately NOT included here.
